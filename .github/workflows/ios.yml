name: iOS build (unsigned IPA for sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - ios-widgets

jobs:
  build:
    name: Build Planner.ipa
    runs-on: macos-15
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Checkout failed
        if: always() && steps.checkout.outcome == 'failure'
        run: |
          echo "::error::Checkout failed. Check the workflow permissions and that the master branch exists."
          exit 1

      - name: Set up Node 20
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Node setup failed
        if: always() && steps.setup_node.outcome == 'failure'
        run: |
          echo "::error::Node 20 setup failed. Check the setup-node step and package-lock.json."
          exit 1

      - name: Install dependencies
        run: npm ci || { echo "::error::npm ci failed. Regenerate package-lock.json so it matches package.json."; exit 1; }

      - name: Build web app
        run: npm run build || { echo "::error::Web build failed. Fix the TypeScript or Vite error above before building iOS."; exit 1; }

      - name: Widget logic tests and previews
        run: |
          mkdir -p build/widget-preview
          if ! swiftc ios/App/PlannerWidgets/Shared/*.swift ios/App/PlannerWidgets/Views/*.swift ios/WidgetTests/main.swift -o build/widgettests > build/widgettests.log 2>&1; then
            grep -E "error:" build/widgettests.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -9 | sed 's/^/::error::/'
            exit 1
          fi
          build/widgettests build/widget-preview/widgets.jpg

      - name: Publish preview as annotations
        if: always()
        run: |
          # Lets the rendered widgets be read from the public check-run API without signing in.
          test -f build/widget-preview/widgets.jpg || exit 0
          base64 -i build/widget-preview/widgets.jpg | tr -d '\n' > build/preview.b64
          echo >> build/preview.b64
          fold -w 50000 build/preview.b64 > build/preview.chunks
          n=0
          while IFS= read -r chunk; do
            [ -n "$chunk" ] || continue
            n=$((n+1))
            if [ "$n" -le 9 ]; then echo "::notice title=widget-preview-$n::$chunk"; fi
          done < build/preview.chunks

      - name: Upload widget preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-preview
          path: build/widget-preview
          if-no-files-found: ignore

      - name: Sync Capacitor iOS project
        run: npx cap sync ios || { echo "::error::Capacitor sync failed. Check capacitor.config.ts and the ios/ project."; exit 1; }

      - name: Add the widget extension to the Xcode project
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/scripts/add_widget_target.rb || { echo "::error::Adding the widget target failed."; exit 1; }

      - name: Install CocoaPods
        run: |
          cd ios/App || { echo "::error::ios/App directory is missing from the repository."; exit 1; }
          pod install || { echo "::error::pod install failed. Check the Podfile and the CocoaPods output above."; exit 1; }

      - name: Archive with Xcode (signing disabled)
        run: |
          cd ios/App || { echo "::error::ios/App directory is missing from the repository."; exit 1; }
          if ! xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
              -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            grep -E "(error:|error :)" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -8 | sed 's/^/::error::/'
            echo "::error::xcodebuild archive failed. $(tail -n 6 build.log | tr '\n' ' ' | cut -c1-800)"
            exit 1
          fi

      - name: Package the IPAs
        run: |
          APP="$GITHUB_WORKSPACE/ios/App/build/App.xcarchive/Products/Applications/App.app"
          [ -d "$APP" ] || { echo "::error::Archived App.app was not found at $APP."; exit 1; }
          [ -d "$APP/PlugIns/PlannerWidgets.appex" ] || { echo "::error::The widget extension is missing from App.app."; exit 1; }
          [ -d "$APP/PlugIns/PlannerWidgets.appex/Metadata.appintents" ] || { echo "::error::Widget settings metadata is missing."; exit 1; }
          work="$RUNNER_TEMP/ipa"
          # Planner.ipa: unsigned, asks for no special permissions.
          mkdir -p "$work/plain/Payload"
          cp -R "$APP" "$work/plain/Payload/App.app"
          (cd "$work/plain" && zip -q -r "$GITHUB_WORKSPACE/Planner.ipa" Payload)
          # Planner-health.ipa: ad-hoc signed so it asks the sideloader for Apple Health access.
          mkdir -p "$work/health/Payload"
          target="$work/health/Payload/App.app"
          cp -R "$APP" "$target"
          for nested in "$target"/Frameworks/*.framework "$target"/PlugIns/*.appex; do
            codesign --force --sign - "$nested"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$target"
          codesign -d --entitlements - "$target" 2>/dev/null | grep -q healthkit || { echo "::error::The Health entitlement was not applied."; exit 1; }
          (cd "$work/health" && zip -q -r "$GITHUB_WORKSPACE/Planner-health.ipa" Payload)
          ls -lh Planner.ipa Planner-health.ipa

      - name: Upload Planner.ipa
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Planner.ipa
          path: Planner.ipa
          if-no-files-found: error

      - name: Upload Planner-health.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Planner-health.ipa
          path: Planner-health.ipa
          if-no-files-found: error

      - name: Upload failed
        if: always() && steps.upload.outcome == 'failure'
        run: |
          echo "::error::Artifact upload failed. Check that Planner.ipa exists and that this workflow can upload artifacts."
          exit 1
