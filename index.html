<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A calm daily planner with colourful categories and notes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Planner</title>
    <script>
      /* Pre-paint theme: sets data-theme before first paint so there is no flash. Kept in sync with src/theme (tested). */
      (function () {
        var ALL = ["wabi", "midnight", "smoke", "graphite", "contrast", "red", "orange", "ember", "emerald", "ocean", "sapphire", "citrus", "blue", "nimbus", "uzumaki"];
        var SCENES = ["midnight", "smoke", "nimbus", "uzumaki"];
        var GLASS = ["midnight", "smoke", "ember", "nimbus", "uzumaki"];
        var BG = { wabi: "#0b0b0a", midnight: "#060606", smoke: "#0a0a0b", graphite: "#1c1d20", contrast: "#000000", red: "#0b0707", orange: "#0b0805", ember: "#140a07", emerald: "#04110c", ocean: "#041218", sapphire: "#070b1a", citrus: "#0e1206", blue: "#f5f8fe", nimbus: "#05060f", uzumaki: "#0b0b0a" };
        var t = "wabi", g = null, fx = false;
        try {
          var v = localStorage.getItem("planner.theme");
          if (ALL.indexOf(v) >= 0) t = v;
          g = localStorage.getItem("planner.glass." + t);
          fx = localStorage.getItem("planner.fx") === "1";
        } catch (e) {}
        var glass = !fx || t === "contrast" ? false : g === null ? GLASS.indexOf(t) >= 0 : g === "1";
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.setAttribute("data-fx", fx ? "1" : "0");
        r.setAttribute("data-scene", fx && t !== "contrast" && SCENES.indexOf(t) >= 0 ? "1" : "0");
        r.setAttribute("data-layout", glass ? "tiles" : "flat");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", BG[t]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
